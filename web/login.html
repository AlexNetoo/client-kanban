<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Project Hub</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="login-wrap">
    <div class="login-card">
      <div class="brand"><img src="/favicon.svg" alt="" width="28" height="28"> Project Hub</div>
      <h1>Sign in</h1>
      <p class="muted login-lead">Enter the password you were given to view project progress.</p>
      <form id="login" novalidate>
        <div id="error" class="form-error" role="alert"></div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        </div>
        <button class="btn btn-primary" type="submit">Sign in</button>
      </form>
    </div>
  </main>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
